<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Music Player</title>
  <link rel="icon" type="image/x-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player" role="application" aria-label="Music player">
    <div class="left">
      <div class="cover" id="cover">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder" alt="cover image" id="coverImg">
      </div>
      <div class="meta">
        <div class="title" id="metaTitle">Title</div>
        <div class="artist" id="metaArtist">Artist</div>
      </div>

      <div class="playlist" id="playlist" aria-label="Playlist">
        <!-- tracks populated by JS -->
      </div>
    </div>

    <div class="right">
      <div class="now">
        <div class="text">
          <div class="song" id="nowTitle">—</div>
          <div class="artist" id="nowArtist">—</div>
        </div>
        <div class="settings">
          <label class="toggle" title="Autoplay">
            <input type="checkbox" id="autoplayToggle" aria-label="Autoplay"> Autoplay
          </label>
        </div>
      </div>

      <div>
        <div class="controls" role="group" aria-label="player controls">
          <button class="btn" id="prevBtn" title="Previous">
            <!-- prev -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 20L9 12 19 4v16zM5 19V5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button class="btn big" id="playBtn" title="Play/Pause">
            <!-- play icon inserted by JS -->
            <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3v18l15-9L5 3z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button class="btn" id="nextBtn" title="Next">
            <!-- next -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4l10 8L5 20V4zm14 16V4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="progresswrap">
        <div class="time" id="currentTime">0:00</div>
        <div class="progress" id="progress">
          <div class="bar" id="progressBar"></div>
          <div class="thumb" id="thumb"></div>
        </div>
        <div class="time" id="duration">0:00</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <div class="volume">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5z" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>

        <div style="display:flex; gap:8px; align-items:center">
          <button class="btn" id="shuffleBtn" title="Shuffle">Shuffle</button>
          <button class="btn" id="repeatBtn" title="Repeat">Repeat</button>
        </div>
      </div>

      <footer class="note">Tip: Use space to Play/Pause • Click progress to seek</footer>
    </div>

    <!-- hidden audio element -->
    <audio id="audio"></audio>
  </div>

  <script src="script.js" ></script>
</body>
</html>
